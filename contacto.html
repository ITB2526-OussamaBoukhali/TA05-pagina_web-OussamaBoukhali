<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SysAdmin</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="pagina-sin-sidebar">

    <div class="layout-grid">

        <aside class="area-logo glass-box">
            <img src="../img/ITB-Logo.png" alt="ITB Logo" class="logo-img">
        </aside>

        <header class="area-header glass-box">
            <h1 class="main-title">CONTACT</h1>

            <nav class="top-nav">
                <a href="index.html" class="pill-btn">Home</a>
                <a href="proyecto1.html" class="pill-btn">Routing</a>
                <a href="proyecto2.html" class="pill-btn">Segmentation</a>
                <a href="listadeproyectos.html" class="pill-btn">List</a>
                <a href="contacto.html" class="pill-btn active">Contact</a>
            </nav>
        </header>

        <main class="area-main">

            <section class="contact-section glass-box">
                <h3>📩 Contact Form</h3>
                <p class="contact-intro">Fill in the details correctly to send me an email.</p>

                <form action="https://formspree.io/f/mqeezkvv" method="POST" class="contact-form">

                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" name="nombre" placeholder="Your name" required>
                    </div>

                    <div class="input-group">
                        <label>Phone</label>
                        <input type="tel" name="telefono" placeholder="600123456" pattern="[0-9]{9}" title="The phone number must have 9 digits" required>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="example@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <label>Remarks / Message</label>
                        <textarea name="observaciones" rows="5" placeholder="Write here what you need to tell me..." required></textarea>
                    </div>

                    <button type="submit" class="action-btn primary full-width">Send Data</button>
                </form>
            </section>

        </main>

        <footer class="area-footer glass-box">
            <p>&copy; Made by Oussama and cooked by Gemini</p>
        </footer>

    </div>

    <script src="../js/java.js"></script>
</body>
</html>
